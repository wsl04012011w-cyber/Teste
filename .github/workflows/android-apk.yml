name: Build Android APK

on:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build GenieX Chat APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Qualcomm Android toolchain image locally
        run: docker build -f base.Dockerfile -t local/qai-hub-apps-android-base .

      - name: Build debug APK
        env:
          QAIHA_BASE_IMAGE: local/qai-hub-apps-android-base
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geniex-chat-android-debug
          path: build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
